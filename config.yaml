# Tunables for the square-packing pipeline (Phase 1+)
paths:
  results_best: results/best
  results_candidates: results/candidates
  results_logs: results/logs
  data_records: data/records_snapshot

geometry:
  # Fast-filter tolerances (section 4.3)
  fast_sep_tol: 1.0e-9
  fast_contain_tol: 1.0e-9
  cell_size: 1.5
  # Pairs within this distance of contact need mpmath pass
  contact_sep_threshold: 1.0e-6

verification:
  # Dilation defaults (section 4.5)
  delta_default: 1.0e-12
  delta_max: 1.0e-6
  delta_growth: 10.0
  mpmath_dps: 50
  normalize: true

store:
  history_keep: 5

grid:
  # Grid baseline uses axis-aligned unit squares on a k x k lattice, k = ceil(sqrt(n))
  origin: constructed
  method: grid

import:
  index_url: https://kingbird.myphotos.cc/packing/squares_in_squares.html
  min_request_interval_s: 1.0
  parse_precision: 50
  # Imports may need a larger dilation than exact grid constructions
  delta_max: 1.0e-4
  user_agent: squarepack-phase2/0.1 (+local research cache; 1 req/s)

constructions:
  goebel_max_strip: 10
  goebel_max_rows: 6
  composition_max_side: 7
  construction_scan_cap: 150
  removal_max_source_gap: 80

search:
  # Default job budgets (section 8); acceptance scripts may override downward.
  budget_s_small: 600
  budget_s_large: 1800
  temperature: 1.0e-3
  eta0: 1.0e-2
  energy_feasible: 1.0e-24
  max_basin_runs_deprioritize: 200
  skip_near_square: true
  workers: 1
