<?xml version="1.0" encoding="UTF-8"?>
<!--
    Made by extending the s(54) found by Joe DeVincentis in April 2014.
    Exact closed-form solution by David Ellsworth on May 29, 2023.

    FullSimplify[Solve[{2*s1-8-4*Sec[a]-2*Sin[a]-2*Cos[a]*(-2+(-6+s1)*Cos[a]+(s1-7)*Sin[a])-12*Tan[a]+2*Tan[a]*s1-2*Sin[a] == 3,
                        s1-6-2*Sin[a]-2*Cos[a]-6*Cos[a]*Sin[a]+Cos[a]*Sin[a]*s1+(-1-2*Cos[a]+2*Sin[a]-6*Cos[a]^2+Cos[a]^2*s1)/Tan[a] == 0},
                       {s1,a}][[2]]]
    s1 = 7-1/Sqrt[2]+Sqrt[1+Sqrt[2]]
    a = ArcTan[(3+Sqrt[2]+2*Sqrt[1+5*Sqrt[2]])/7]
    
    (* "a" in terms of "s1" *)
    a = Solve[s1-6-2*Sin[a]-2*Cos[a]-6*Cos[a]*Sin[a]+Cos[a]*Sin[a]*s1+(-1-2*Cos[a]+2*Sin[a]-6*Cos[a]^2+Cos[a]^2*s1)/Tan[a] == 0, a][[2, 1, 2, 1, 1]]
    a = ArcTan[1/2*z, (7/2*z+2-s1*z/2)/(s1-6)] /. z->(4*s1-28+2*Sqrt[465*s1^2-1908*s1+2916-50*s1^3+2*s1^4])/(85-26*s1+2*s1^2)
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "13.84666719284348978294331459096"> <!-- s1+6 -->
    <!ENTITY s1 "7.84666719284348978294331459096">
    <!ENTITY a  "55.2650997396489041743253949403">
    <!ENTITY y2 "6.67333359642174489147165729548"> <!-- s1-1-(1-(s1-7)*Sin[a])*Cos[a] -->
    <!ENTITY x3 ".776886987015018653672079476532"> <!-- Cos[a]+Sin[a]*(2-(s1-6)*Cos[a]-(s1-7)*Sin[a]) -->
    <!ENTITY y3 "5.32179712645279131236772171871"> <!-- s1-1-2*Sec[a]-Sin[a]-Cos[a]*((s1-6)*Cos[a]+(s1-7)*Sin[a]-2)-6*Tan[a]+s1*Tan[a] -->
    <!ENTITY x4 "1.52688698701501865367207947653"> <!-- 1+Sin[a]+Cos[a]+6*Cos[a]*Sin[a]-Cos[a]*Sin[a]*s1 -->
    <!ENTITY y4 "5.99513072287453620383937901419"> <!-- s1-1+Cos[a]-Sin[a]+6*Cos[a]^2-Cos[a]^2*s1 -->
    <!ENTITY x5 "1.55377397403003730734415895306"> <!-- 2*Cos[a]+2*Sin[a]*(2-(-6+s1)*Cos[a]-(s1-7)*Sin[a]) -->
    <!ENTITY y5 "4.64359425290558262473544343742"> <!-- 2*(s1-4-2*Sec[a]-Sin[a]-Cos[a]*((s1-6)*Cos[a]+(s1-7)*Sin[a]-2)-6*Tan[a]+s1*Tan[a]) -->
    <!ENTITY r1 ".077284923780532858179616104875"> <!-- Cos[a]*(2*(s1-7)+(s1-6)*Cot[a])+(6-s1+2*Csc[a])*(1+2*Csc[a]*Sec[a])*Sin[a]-6*Cot[a] -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="side0">
        <g transform="translate(&s;) scale(-1 1)">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M0,1 H1 V0"/>
        </g>
        <g>
            <path style="stroke:none" d="M0,11 H 1 V10 H2 V9 H3 V8 H4 V7 H5 V6 H7 V5 H8 V4 H9 V3 H10 V2 H11 V1 H12 V0 H0"/>
            <path style=  "fill:none" d="M0,11 H 1 V0
                                         M0,10 H 2 V0
                                         M0, 9 H 3 V0
                                         M0, 8 H 4 V0
                                         M0, 7 H 5 V0
                                         M6, 6     V0
                                         M0, 6 H 7 V0
                                         M0, 5 H 8 V0
                                         M0, 4 H 9 V0
                                         M0, 3 H10 V0
                                         M0, 2 H11 V0
                                         M0, 1 H12 V0"/>
        </g>
        <g transform="translate(0 6)">
            <g id="side1">
                <g id="addon">
                    <rect width="1" height="1" transform="translate(0    6   ) rotate(-&a;)"/>
                    <rect width="1" height="1" transform="translate(0.75 &y2;) rotate(-&a;)"/>
                    <rect width="1" height="1" transform="translate(&x3; &y3;) rotate(-&a;)"/>
                    <rect width="1" height="1" transform="translate(&x4; &y4;) rotate(-&a;)"/>
                    <g transform="translate(&x5; &y5;) rotate(-&a;)">
                        <g id="two" >
                            <rect width="2" height="1"/>
                            <path style="fill:none" d="M1,0 V1"/>
                        </g>
                        <use xlink:href="#two" transform="translate(-&r1; 1)"/>
                    </g>
                </g>
            </g>
            <use xlink:href="#side1" transform="translate(3 -3)"/>
        </g>
    </g>
    <use xlink:href="#side0" transform="translate(&s; &s;) scale(-1)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>