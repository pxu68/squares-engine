<!--
    Originally found by Sigvart Brendberg's program, https://hohmiyazawa.github.io/squares_in_rects/squaredrawer.html
        Extended from the s(88) found by Erich Friedman in 1997, by generalizing the s(41) technique found by Charles F. Cottingham in 1979.
    Improved by David Ellsworth on November 26, 2024, by adapting the s(102) improvement by David W. Cantrell in November 2024, as was applied to the s(102) found by Károly Hajba in September 2024.
    Improved by David Ellsworth on November 30, 2024, by adapting and extending the full technique used in the s(37) found by David W. Cantrell in September 2002.
    Improved by David Ellsworth on January 1, 2025.

    RootReduce[Solve[{RotationTransform[-Pi/4][({1 + (s - 16)/2, s - 1 + (s - 16)/2} + RotationTransform[Pi/4][{-2 + u6, -4 - 3*v3 + v4}] + RotationTransform[Pi/4 + a][{-2*v0, -3}]) - {s, s}/2][[2]] == 1/2,
                      RotationTransform[Pi/4 - a][{s - 14, s - 2} - {2, 13}][[2]] == 2,
                      v4 == RotationTransform[-Pi/4 - a][({1, s - 1} + RotationTransform[Pi/4 + a][{r0 - 2, -2 + v1}]) - ({1 + (s - 16)/2, s - 1 + (s - 16)/2} + RotationTransform[Pi/4][{-2 + u4, -2 - v3}] + RotationTransform[Pi/4 + a][{0, 1}])][[2]]/Cos[a]},
                     {s, a, v4}][[4]]]
    s  = Root[58646728859167 - 27584892248768*# + 5669988144368*#^2 - 665109430256*#^3 + 48690729660*#^4 - 2277483296*#^5 + 66453952*#^6 - 1105632*#^7 + 8028*#^8, 1]
    a  = ArcTan[Root[3969 - 235368*# + 35084*#^2 - 489976*#^3 + 100358*#^4 - 394072*#^5 + 65996*#^6 - 126024*#^7 + 14049*#^8, 1]]
    v4 = Root[-864604325495057 + 82443916303508896*# - 24049713801649840*#^2 + 2113172728064000*#^3 - 907833961031328*#^4 - 40464341157376*#^5 + 98571547105024*#^6 - 16156883853312*#^7 + 962928928512*#^8, 2]

    s = Root[-FactorList[s[[1, 1]], Extension -> Sqrt[2]][[3, 1]], 1]
    s = Root[117431679 + 18867680*Sqrt[2] - (27290208 + 3419060*Sqrt[2])*# + (2378600 + 206890*Sqrt[2])*#^2 - (92136 + 4180*Sqrt[2])*#^3 + 1338*#^4, 1]
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "16.905967648284020214689373304053696">
    <!ENTITY a  ".96794861665201811686917558578228871">
    <!ENTITY v4 ".01051943211499677020577140051988406">
    <!ENTITY r0 ".62970247336030469189296013557415536"> <!-- (s - 16)*Cos[Pi/4 + a] -->
    <!ENTITY v0 ".02389043241507144522095993137125820"> <!-- Cos[Pi/4 - a] - Sin[Pi/4 - a] -->
    <!ENTITY v1 ".01689549772618979531214616185835923"> <!-- Tan[a] -->
    <!ENTITY u2 ".01166148353893301615401460626108575"> <!-- 2 - RotationTransform[-Pi/4][{s - 13, s - 1} - {1, 12}][[1]] -->
    <!ENTITY v3 "1.0167503883945185155891481111219384"> <!-- Sin[a] + Cos[a] -->
    <!ENTITY u4 ".01578896484899652862359037021192291"> <!-- u2 - (u[[1]] - u[[2]]*Tan[a] /.u -> RotationTransform[-Pi/4][{ 2,13} - ({1 + (s - 16)/2, s - 1 + (s - 16)/2} +RotationTransform[Pi/4][{-2 + u2, -2 -   v3 + v4}])]) -->
    <!ENTITY u5 ".01453234653010110603741540843432041"> <!--      (u[[1]] - u[[2]]*Tan[a] /.u -> RotationTransform[-Pi/4][{ 3,12} - ({1 + (s - 16)/2, s - 1 + (s - 16)/2} +RotationTransform[Pi/4][{-2     , -3 -   v3 + v4}])]) -->
    <!ENTITY u6 ".01225544196955628390919734279884651"> <!-- u2 - (u[[1]] - u[[2]]*Tan[a] /.u -> RotationTransform[-Pi/4][{ 5,10} - ({1 + (s - 16)/2, s - 1 + (s - 16)/2} +RotationTransform[Pi/4][{-2 + u2, -4 - 3*v3 + v4}])]) -->
    <!-- u4-u6 above follow this rule: inside the "RotationTransform[Pi/4]", subtract 1 from the already negative "vertical" translation, leaving it otherwise identical to that used by the domino being
         corrected (notably, keep the exact number of "-v3" translations intact); CW is the "u2" variant, and CCW is the non-"u2" variant; at the beginning of the inside of the "RotationTransform[-Pi/4]",
         put the coordinates of the corner the domino is touching on its upper-left side. -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.003" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"/>
        <g id="corner">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M1,0 V1 H0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <path style="stroke:none" d="M0, 0 H14 V1 H13 V2 H12 V3 H11 V4 H10 V5 H9 V6 H8 V7 H7 V8 H6 V9 H5 V10 H4 V11 H3 V12 H2 V13 H1 V14 H0"/>
    <path style=  "fill:none" d="M0, 1 H14 V0
                                 M0, 2 H13 V0
                                 M0, 3 H12 V0
                                 M0, 4 H11 V0
                                 M0, 5 H10 V0
                                 M0, 6 H 9 V0
                                 M0, 7 H 8 V0
                                 M0, 8 H 7 V0
                                 M0, 9 H 6 V0
                                 M0,10 H 5 V0
                                 M0,11 H 4 V0
                                 M0,12 H 3 V0
                                 M0,13 H 2 V0
                                 M0,14 H 1 V0"/>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M0,0 H15 V1 H14 V2 H13 V3 H12 V4 H11 V5 H10 V6 H9 V7 H8 V8 H7 V9 H6 V10 H5 V11 H4 V12 H3 V13 H2 V14 H1 V15 H0"/>
        <path style=  "fill:none" d="M15,0 V 1 H0
                                     M14,0 V 2 H0
                                     M13,0 V 3 H0
                                     M12,0 V 4 H0
                                     M11,0 V 5 H0
                                     M10,0 V 6 H0
                                     M 9,0 V 7 H0
                                     M 8,0 V 8 H0
                                     M 7,0 V 9 H0
                                     M 6,0 V10 H0
                                     M 5,0 V11 H0
                                     M 4,0 V12 H0
                                     M 3,0 V13 H0
                                     M 2,0 V14 H0
                                     M 1,0 V15 H0"/>
    </g>
    <use xlink:href="#corner" transform="translate(&s; 0) scale(-1  1)"/>
    <use xlink:href="#corner" transform="translate(0 &s;) scale( 1 -1)"/>
    <defs>
        <g id="straight">
            <rect width="2" height="1"/>
            <path style="fill:none" d="M1,0 v1
                                       M2,0 v1"/>
        </g>
        <g id="turn_CCW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 &v1;)"/>
        </g>
        <g id="turn_CW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 -&v1;)"/>
        </g>
    </defs>
    <g id="side1">
        <g transform="translate(1 &s;) translate(0 -1) rotate(45) rotate(&a;) translate(&r0;) translate(-2 -1) translate(0 &v1;)">
            <use xlink:href="#turn_CW"/>
            <use xlink:href="#turn_CW" transform="translate(0 -1)"/>
        </g>
        <g transform="scale(.5 1) translate(&s; &s;) translate(-14 -1) scale(2 .5) translate(0 &s;) translate(0 -16) scale(1 2) rotate(45) translate(-2 -1) translate(0 &v4;)">
<!--
            <use xlink:href="#straight"/>
            <use xlink:href="#straight" transform="translate(&u2;) translate(0 -1)"/>
-->
            <use xlink:href="#turn_CW"  transform="translate(&u4;) translate(0 -1) translate(0 -&v3;) rotate(&a;)"/>
            <use xlink:href="#straight" transform="                translate(0 -2) translate(0 -&v3;)"/>
            <use xlink:href="#turn_CCW" transform="translate(&u5;) translate(0 -2) translate(0 -&v3;) rotate(-&a;) translate(0 -1)"/>
            <use xlink:href="#straight" transform="translate(&u2;) translate(0 -3) translate(0 -&v3;) translate(0 -&v3;)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u6;) translate(0 -3) translate(0 -&v3;) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u6;) translate(0 -3) translate(0 -&v3;) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -1)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u6;) translate(0 -3) translate(0 -&v3;) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -2)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u6;) translate(0 -3) translate(0 -&v3;) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -3) translate(-&v0;)"/>
        </g>
    </g>
    <use xlink:href="#side1"    transform="rotate(90) scale(1 -1)"/>
    <use xlink:href="#straight" transform="translate(&s; &s;) translate(-8 -8) rotate(45) translate(-2 -.5)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>