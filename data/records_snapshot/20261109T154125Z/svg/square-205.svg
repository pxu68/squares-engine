    Unset[{s, a, c, r1, u2, u3, u4, u5, u6, r7, v8, f1, f2, f3}];
    r1 = (s - 13)*Sin[a];
    u2 = Cos[a] - Sin[a];
    u3 = (({12, 1} + RotationTransform[a][{2       ,  2 - r1}])[[2]] - (s - 12))/Sin[a];
    u4 = (({12, 1} + RotationTransform[a][{2 - 3*u2,  6 - r1}])[[2]] - (s -  9))/Sin[a];
    u5 = (({12, 1} + RotationTransform[a][{2 - 6*u2, 10 - r1}])[[2]] - (s -  6))/Sin[a];
    u6 = (({12, 1} + RotationTransform[a][{2 - 9*u2, 14 - r1}])[[2]] - (s -  3))/Sin[a];
    r7 = ({s - 13, s - 1} + RotationTransform[c][{-2, 0}])[[1]]/Sin[c];
    v8 = ((s - 13) - (Cos[a] + 2*Sin[a]))/Cos[a];
    f1 = RotationTransform[-a][{s - 11, s - 3} - {2, 11}][[1]] - 2;
    f2 = RotationTransform[-c][({s - 13, s - 1} + RotationTransform[c][{0, r7 - 1}]) - ({12, 1} + RotationTransform[a][{-11*u2, 16 - r1 - v8}])][[2]];
    f3 = D[f2, c];
    AbsoluteTiming[solution = Solve[{f1 == 0, f2 == 0, f3 == 0}, {s, a, c}][[7]]][[1]]      (*  4.19 seconds *)
  (*AbsoluteTiming[ToString[{s, a[[1, 1]], c[[1, 1]]} /. RootReduce[solution], InputForm]]*)
    N[{s, a*180/Pi, c*180/Pi, r1, u2, u3, u4, u5, u6, r7, v8} /. {a -> a[[1, 1]], c -> c[[1, 1]]} /. solution, 35]

    (* Alternative 3rd constraint *)
    f3 = Det[Grad[{s, f1, f2}, {s, a, c}]];

    AbsoluteTiming[ToString[RootApproximant[N[Tan[a[[1, 1]]] /. solution, 5000], 84], InputForm]]  (* took 240.668 seconds; verified correct with 100000 digits *)
    AbsoluteTiming[ToString[RootApproximant[N[Tan[c[[1, 1]]] /. solution, 3000], 40], InputForm]]  (* took  30.730 seconds; verified correct with 100000 digits *)
