<?xml version="1.0" encoding="UTF-8"?>
<!--
    Found by David Ellsworth on December 1, 2024.
    Made by extending the s(102) found by Károly Hajba in September 2024 (which extends the s(37) made by adding an "L" to the s(26) found by Erich Friedman in 1997 and converting it to a primitive packing), and generalizing the full technique used in the s(37) found by David W. Cantrell in September 2002.
    Improved by David Ellsworth on December 28, 2024.
    Fixed by David Ellsworth on January 13, 2026 (there were micro-overlaps).

    Unset[{s, a, r0, v0, v1, u2, v3, v4, u5, u6, u7, w8, v8}];
    r0 = (s - 16)*Cos[Pi/4 - a];
    v0 = Cos[Pi/4 - a] - Sin[Pi/4 - a];
    v1 = Tan[a];
    u2 = 3 - RotationTransform[-Pi/4][{s - 14, s - 1} - {1, 13}][[1]];
    v3 = Sin[a] + Cos[a];
    v4 = RotationTransform[-Pi/4][({2, s - 1} + RotationTransform[Pi/4 - a][{r0 - 2 + v0, -2 - v0 - v1}]) - ({2 + (s - 16)/2, s - 1 + (s - 16)/2} + RotationTransform[Pi/4][{-3, -1 - v3}])][[2]];
    u5 = u2 - (u[[1]] - u[[2]]*Tan[a] /. u -> RotationTransform[-Pi/4][{3, 11} - ({2 + (s - 16)/2, s - 1 + (s - 16)/2} + RotationTransform[Pi/4][{-3 + u2, -2 - 2*v3 + v4}])]);
    u6 = RotationTransform[-Pi/4][({s/2 - 6, s - 1 + s/2 - 8} + RotationTransform[Pi/4][{0, -1 + v4 - 1 - v3*2 - 1}] + RotationTransform[Pi/4 + a][{-v0*2, -3}]) - {s - 9, s - 6}][[1]];
    u7 = RotationTransform[a - Pi/4][{6, 8} - ({s/2 - 6, s - 1 + s/2 - 8} + RotationTransform[Pi/4][{-3, -1 + v4 - 1 - v3*2 - 1}] + RotationTransform[Pi/4 + a][{-v0*2, -3}] + RotationTransform[Pi/4 - a][{0, -1}])][[1]]/Cos[a];
    w8 = (({2 + (s - 16)/2, s - 1 + (s - 16)/2} + RotationTransform[Pi/4][{-3 + u5, -2 - 2*v3 + v4}] + RotationTransform[Pi/4 + a][{3 - v0, -2 - 2*v1}])[[1]] - (s - 10))/Sin[Pi/4 + a];
    v8 = w8*Cos[a];
    solution = RootReduce[
        Solve[{RotationTransform[-Pi/4][({s/2 - 6, s - 1 + s/2 - 8} + RotationTransform[Pi/4][{-3 + u7, -1 + v4 - 1 - v3*2 - 1}] + RotationTransform[Pi/4 + a][{-v0*2, -3}] + RotationTransform[Pi/4 - a][{1, -1}]) - {s/2, s/2}][[2]] == 1/2,
               RotationTransform[Pi/4 - a][{s - 14, s - 1} - {1, 13}][[2]] == 3},
              {s, a}, GeneratedParameters -> C][[1]] /. _C -> 0];
    ToString[solution, InputForm]
    N[{s, a*180/Pi, r0, v0, v1, u2, v3, v4, u5, u6, u7, w8, v8} /. solution, 50]
(*
    s = Root[222695263169761 - 105284582762928*# + 21612680769420*#^2 - 2511556300176*#^3 + 180271536264*#^4 - 8156031520*#^5 + 226009400*#^6 - 3480000*#^7 + 22500*#^8, 1]
    a = ArcTan[Root[7769 - 191888*# + 85292*#^2 - 453168*#^3 + 149974*#^4 - 379120*#^5 + 75500*#^6 - 114000*#^7 + 5625*#^8, 1]]

    s = Root[-FactorList[s[[1, 1]], Extension -> Sqrt[2]][[2, 1]], 1]
    s = Root[-17614577 - 6617328*Sqrt[2] + (3938328 + 1264082*Sqrt[2])*# + (-324554 - 80686*Sqrt[2])*#^2 + (11600 + 1720*Sqrt[2])*#^3 - 150*#^4, 1]
*)
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "16.602571412344485881456185040948345754378714995228">
    <!ENTITY a  "2.3521263070128006310382374063413990370318887446792">
    <!ENTITY r0 ".44321011263297566742829346521654591141786134898125">
    <!ENTITY v0 ".05804048222314731613570664956282523966460002820937">
    <!ENTITY v1 ".04107542581398677706878557425742712661424435344656">
    <!ENTITY u2 ".02651499280447486682943726070987250497821113465602">
    <!ENTITY v3 "1.0401982892413216432789942692128397047509176432273">
    <!ENTITY v4 ".00436085031539269726383168594796544814115991812708">
    <!ENTITY u5 ".03121482209475492816653302407036069789144322231074">
    <!ENTITY u6 ".00713929285995196086426839050050053006705654283304">
    <!ENTITY u7 ".02455057624669413411298584945479665866123074785549">
    <!ENTITY w8 ".00856002810119103786829348682961583966969075695293">
    <!ENTITY v8 ".00855281602651861400756697252878358527390208441788">
    <!-- u5 above follows this rule: inside the "RotationTransform[Pi/4]", subtract 1 from the already negative "vertical" translation, leaving it otherwise identical to that used by the domino being
         corrected (notably, keep the exact number of "-v3" translations intact); CW is the "u2" variant, and CCW is the non-"u2" variant; at the beginning of the inside of the "RotationTransform[-Pi/4]",
         put the coordinates of the corner the domino is touching on its upper-left side.
         The others, u6-u7, are handling a special case, and do not follow that rule. -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"/>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g>
        <path style="stroke:none" d="M13,0 V 1 H12 V2 H11 V3 H10 V4 H9 V5 H8 V6 H7 V7 H6 V8 H5 V9 H4 V10 H3 V11 H2 V12 H1 V13 H0 V0"/>
        <path style=  "fill:none" d="M13,0 V 1 H0
                                     M12,0 V 2 H0
                                     M11,0 V 3 H0
                                     M10,0 V 4 H0
                                     M 9,0 V 5 H0
                                     M 8,0 V 6 H0
                                     M 7,0 V 7 H0
                                     M 6,0 V 8 H0
                                     M 5,0 V 9 H0
                                     M 4,0 V10 H0
                                     M 3,0 V11 H0
                                     M 2,0 V12 H0
                                     M 1,0 V13 H0"/>
    </g>
    <g transform="translate(&s;) scale(-1 1)">
        <path style="stroke:none" d="M2,0 V1 H1 V2 H0 V0"/>
        <path style=  "fill:none" d="M2,0 V1 H0
                                     M1,0 V2 H0"/>
    </g>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M14,0 V 1 H13 V2 H12 V3 H11 V4 H10 V5 H9 V6 H8 V7 H7 V8 H6 V9 H5 V10 H4 V11 H3 V12 H2 V13 H1 V14 H0 V0"/>
        <path style=  "fill:none" d="M14,0 V 1 H0
                                     M13,0 V 2 H0
                                     M12,0 V 3 H0
                                     M11,0 V 4 H0
                                     M10,0 V 5 H0
                                     M 9,0 V 6 H0
                                     M 8,0 V 7 H0
                                     M 7,0 V 8 H0
                                     M 6,0 V 9 H0
                                     M 5,0 V10 H0
                                     M 4,0 V11 H0
                                     M 3,0 V12 H0
                                     M 2,0 V13 H0
                                     M 1,0 V14 H0"/>
    </g>
    <g transform="translate(0 &s;) scale(1 -1)">
        <path style="stroke:none" d="M2,0 V1 H1 V2 H0 V0"/>
        <path style=  "fill:none" d="M2,0 V1 H0
                                     M1,0 V2 H0"/>
    </g>
    <defs>
        <g id="straight">
            <rect width="3" height="1"/>
            <path style="fill:none" d="M1,0 v1
                                       M2,0 v1
                                       M3,0 v1"/>
        </g>
        <g id="straight2">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1)"/>
            <use xlink:href="#one" transform="translate(2 &v8;)"/>
        </g>
        <g id="turn_CCW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1  &v1;)"/>
            <use xlink:href="#one" transform="translate(1  &v1;) translate(1 &v1;)"/>
        </g>
        <g id="turn_CCW2">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1  &v1;)"/>
            <use xlink:href="#one" transform="translate(1  &v1;) translate(1 &v1;) translate(0 &w8;)"/>
        </g>
        <g id="turn_CW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 -&v1;)"/>
            <use xlink:href="#one" transform="translate(1 -&v1;) translate(1 -&v1;)"/>
        </g>
        <g id="turn_CW2">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 -&v1;)"/>
            <use xlink:href="#one" transform="translate(1 -&v1;) translate(1 -&v1;) translate(0 &w8;)"/>
        </g>
    </defs>
    <g id="side1">
        <g transform="translate(2 &s;) translate(0 -1) rotate(45) rotate(-&a;) translate(&r0;) translate(-3 -1) translate(0 -&v0;) translate(0 -&v1;)">
            <use xlink:href="#turn_CCW2"/>
            <use xlink:href="#turn_CCW2" transform="translate(&v0; -1)"/>
        </g>
        <g transform="scale(.5 1) translate(&s; &s;) translate(-12 -1) scale(2 .5) translate(0 &s;) translate(0 -16) scale(1 2) rotate(45) translate(-3 -1) translate(0 &v4;)">
            <use xlink:href="#straight2" transform="translate( &u2;) translate(0 -1) translate(0 -&v3;)"/>
            <use xlink:href="#turn_CW2"  transform="translate( &u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;)"/>
            <use xlink:href="#turn_CW2"  transform="translate( &u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -1)"/>
            <use xlink:href="#turn_CW2"  transform="translate( &u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -2)"/>
            <use xlink:href="#turn_CW"   transform="translate( &u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -3) translate(-&v0;)"/>
            <use xlink:href="#straight"  transform="translate(-&u6;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -3) translate(-&v0;) rotate(-&a;) translate(0 -1)"/>
            <use xlink:href="#turn_CCW"  transform="translate( &u7;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -3) translate(-&v0;) rotate(-&a;) translate(0 -1) rotate(-&a;) translate(0 -1)"/>
        </g>
    </g>
    <use xlink:href="#side1" transform="rotate(90) scale(1 -1)"/>
    <use xlink:href="#straight" transform="translate(7 7) rotate(45) translate(0 -.5)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>
