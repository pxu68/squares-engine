    a = ArcTan[Root[10707552000 + 62864294400*# - 96541079904*#^2 - 1292105807712*#^3 - 1875818150289*#^4 + 5159915245404*#^5 + 20842199296164*#^6 + 36570538950216*#^7 + 43401956930268*#^8 - 24891365830180*#^9 - 263476448246596*#^10 - 573659853937176*#^11 - 678894421513866*#^12 - 229416600394892*#^13 + 892498080908196*#^14 + 1778871423783404*#^15 + 1714479777004750*#^16 + 1486507630649996*#^17 + 1133853720557414*#^18 + 436012906716892*#^19 + 322706378271121*#^20 + 276583595568120*#^21 - 56797247279368*#^22 + 70381463238608*#^23 + 48534582071758*#^24 - 83270410180504*#^25 + 45820563515458*#^26 - 2458570440564*#^27 - 20811049411099*#^28 + 17414576378560*#^29 - 7930963437414*#^30 + 1262205486952*#^31 + 432272743973*#^32 - 295352863796*#^33 + 49842264762*#^34 + 31160528*#^35 - 599990833*#^36 + 25304528*#^37 + 6461856*#^38 + 281856*#^39 + 3840*#^40, 9]]
    c = ArcTan[Root[331776000 - 403144704*# - 1337743872*#^2 - 18039865728*#^3 - 194162994960*#^4 - 267609234240*#^5 - 2238702516344*#^6 - 2077701131384*#^7 - 9014953989305*#^8 - 7291152650584*#^9 - 7788713015440*#^10 + 12224952361960*#^11 + 77261021159276*#^12 + 32041670994232*#^13 + 322112073655156*#^14 - 87271383248392*#^15 + 577390755397940*#^16 - 552434121139008*#^17 + 602708686737376*#^18 - 1562727857137520*#^19 + 373381755985466*#^20 - 2636923900846640*#^21 + 247376563168740*#^22 - 2156228525985216*#^23 + 962492886199554*#^24 + 255472437733456*#^25 + 1860549553431420*#^26 + 1710486016772048*#^27 + 1176749833276952*#^28 + 646330801482392*#^29 - 254700113157420*#^30 - 509731676126800*#^31 - 575054217551717*#^32 - 423359730563800*#^33 - 214971816228988*#^34 - 95994348399240*#^35 - 30381138163602*#^36 - 4794228173160*#^37 - 235750468356*#^38 + 11279383200*#^39 + 1677203955*#^40, 8]]
