<!--
    Found    by David Ellsworth on November 17, 2024, based on the s(69) found by Maurizio Morandi in June 2010.
    Improved by David Ellsworth on December 13, 2024.
    Improved by David Ellsworth on December 13, 2024, after attempting the technique from the s(69) found by David W. Cantrell on August 3, 2023, and using the technique from the s(53) improved by David W. Cantrell on December 9, 2024.
    Improved by David W. Cantrell on January 23, 2025 (idea), and David Ellsworth on January 25, 2025 (implementation).

    Unset[{s, a, c, r1, u2, u3, u4, u5, r6, v7, f1, f2, f3}];
    r1 = (s - 10)*Sin[a];
    u2 = Cos[a] - Sin[a];
    u3 = (({9, 1} + RotationTransform[a][{2       ,  2 - r1}])[[2]] - (s - 9))/Sin[a];
    u4 = (({9, 1} + RotationTransform[a][{2 - 3*u2,  6 - r1}])[[2]] - (s - 6))/Sin[a];
    u5 = (({9, 1} + RotationTransform[a][{2 - 6*u2, 10 - r1}])[[2]] - (s - 3))/Sin[a];
    r6 = ({s - 10, s - 1} + RotationTransform[c][{-2, 0}])[[1]]/Sin[c];
    v7 = ((s - 10) - (Cos[a] + 2*Sin[a]))/Cos[a];
    f1 = RotationTransform[-a][{s - 8, s - 3} - {2, 8}][[1]] - 2;
    f2 = RotationTransform[-c][({s - 10, s - 1} + RotationTransform[c][{0, r6 - 1}]) - ({9, 1} + RotationTransform[a][{-8*u2, 12 - r1 - v7}])][[2]];
    f3 = D[f2, c]; (* solution [[7]] *)
    AbsoluteTiming[solution = Solve[{f1 == 0, f2 == 0, f3 == 0}, {s, a, c}][[7]]][[1]]      (*  3.96 seconds *)
  (*AbsoluteTiming[ToString[{s, a[[1, 1]], c[[1, 1]]} /. RootReduce[solution], InputForm]]*)
    N[{s, a*180/Pi, c*180/Pi, r1, u2, u3, u4, u5, r6, v7} /. {a -> a[[1, 1]], c -> c[[1, 1]]} /. solution, 35]

    (* Alternative 3rd constraint *)
    f3 = Det[Grad[{s, f1, f2}, {s, a, c}]]; (* solution [[15]] *)

    AbsoluteTiming[ToString[RootApproximant[N[Tan[a[[1, 1]]] /. solution, 5000], 84], InputForm]]  (* took 237.578 seconds; verified correct with 100000 digits *)
    AbsoluteTiming[ToString[RootApproximant[N[Tan[c[[1, 1]]] /. solution, 3000], 40], InputForm]]  (* took  30.493 seconds; verified correct with 100000 digits *)
    AbsoluteTiming[ToString[RootApproximant[N[s              /. solution, 6000], 40], InputForm]]  (* took  91.232 seconds; verified correct with 100000 digits *)
(*
