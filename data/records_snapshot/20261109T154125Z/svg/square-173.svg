<?xml version="1.0" encoding="UTF-8"?>
<!--
    Made by adding an "L" to the s(148) which continues a pattern found by Frits Göbel in early 1979.
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "13.65685424949238019520675489684"> <!-- 4 + Sqrt[2]*4 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.003" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <g id="stairs">
            <path style="stroke:none" d="M0,0 H6 V2 H5 V3 H4 V4 H3 V5 H2 V6 H1 V7 H0"/>
            <path style=  "fill:none" d="M0,1 H6
                                         M0,2 H6 V0
                                         M0,3 H5 V0
                                         M0,4 H4 V0
                                         M0,5 H3 V0
                                         M0,6 H2 V0
                                         M0,7 H1 V0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <use xlink:href="#stairs"/>
    <use xlink:href="#stairs" transform="translate(&s; &s;) rotate(90) scale(-1 1)"/>
    <g transform="translate(0 &s;) scale(1 -1)">
        <path style="stroke:none" d="M0,0 H6 V1 H5 V2 H4 V3 H3 V4 H2 V5 H1 V6 H0"/>
        <path style=  "fill:none" d="M0,1 H6 V0
                                     M0,2 H5 V0
                                     M0,3 H4 V0
                                     M0,4 H3 V0
                                     M0,5 H2 V0
                                     M0,6 H1 V0"/>
    </g>
    <g transform="translate(&s;) scale(-1 1)">
        <path style="stroke:none" d="M0,0 H7 V2 H6 V3 H5 V4 H4 V5 H3 V6 H2 V7 H0"/>
        <path style=  "fill:none" d="M0,1 H7
                                     M0,2 H7 V0
                                     M0,3 H6 V0
                                     M0,4 H5 V0
                                     M0,5 H4 V0
                                     M0,6 H3 V0
                                     M0,7 H2 V0
                                     M1,7    V0"/>
    </g>
    <g transform="scale(.5) translate(&s; &s;) translate(-1 1) scale(2) rotate(45) translate(-4 -4)">
        <rect width="8" height="8"/>
        <path style="fill:none" d="M0,1 H8 M1,0 V8
                                   M0,2 H8 M2,0 V8
                                   M0,3 H8 M3,0 V8
                                   M0,4 H8 M4,0 V8
                                   M0,5 H8 M5,0 V8
                                   M0,6 H8 M6,0 V8
                                   M0,7 H8 M7,0 V8"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>