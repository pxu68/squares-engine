<?xml version="1.0" encoding="UTF-8"?>
<!--
    Adds an "L" to the s(227) found by David Ellsworth on January 27, 2025 (using a computer program he wrote) which continues the s(26), s(85) series found by Erich Friedman in 1997.
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "16.571067811865475244008443621048490393"> <!-- 19/2 + Sqrt[2]*5 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <g id="side2">
            <path style="stroke:none" d="M 8,0 V 1 H7 V2 H6 V3 H5 V4 H4 V5 H3 V6 H2 V7 H1 V8 H0 V0"/>
            <path style=  "fill:none" d="M 8,0 V 1 H0
                                         M 7,0 V 2 H0
                                         M 6,0 V 3 H0
                                         M 5,0 V 4 H0
                                         M 4,0 V 5 H0
                                         M 3,0 V 6 H0
                                         M 2,0 V 7 H0
                                         M 1,0 V 8 H0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="side1">
        <path style="stroke:none" d="M 8,0 V2 H7 V3 H6 V4 H5 V5 H4 V6 H3 V7 H2 V8 H0 V0"/>
        <path style=  "fill:none" d="M 8,1     H0
                                     M 8,0 V 2 H0
                                     M 7,0 V 3 H0
                                     M 6,0 V 4 H0
                                     M 5,0 V 5 H0
                                     M 4,0 V 6 H0
                                     M 3,0 V 7 H0
                                     M 2,0 V 8 H0
                                     M 1,0 V 8"/>
    </g>
    <use xlink:href="#side1" transform="translate(&s;    ) scale(-1  1)"/>
    <use xlink:href="#side2" transform="translate(0   &s;) scale( 1 -1)"/>
    <use xlink:href="#side2" transform="translate(&s; &s;) scale(-1 -1)"/>
    <g transform="scale(.5) translate(&s; &s;) translate(0 1) scale(2) rotate(45) translate(-5 -5)">
        <rect width="10" height="10"/>
        <path style="fill:none" d="M1,0 V10 M0,1 H10
                                   M2,0 V10 M0,2 H10
                                   M3,0 V10 M0,3 H10
                                   M4,0 V10 M0,4 H10
                                   M5,0 V10 M0,5 H10
                                   M6,0 V10 M0,6 H10
                                   M7,0 V10 M0,7 H10
                                   M8,0 V10 M0,8 H10
                                   M9,0 V10 M0,9 H10"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>