<!--
    Found by Károly Hajba in September 2024.
        Extends the s(37) found by Evert Stenlund in early 1980.
        Unlike the s(66) found by Evert Stenlund in early 1980, is clamped on its narrow side while having play along its long side.
    Improved by David W. Cantrell on November 24, 2024.
    Improved by David Ellsworth on November 26, 2024, by generalizing the full technique used in the s(37) found by David W. Cantrell in September 2002.
    Improved by David Ellsworth on December 19, 2024.
    Improved by David W. Cantrell on/before January 16, 2025, with exact analytic solution. This technique was found independently by both David W. Cantrell and David Ellsworth, but was applied to this s(102) first by David W. Cantrell.
    Exact polynomial root solution found by David Ellsworth on January 19, 2025, from David W. Cantrell's analytic solution.
    Reconstructed by David Ellsworth on September 16, 2026, with exact polynomial root solution, independently (without consulting David W. Cantrell's solution, which, in any case, was much longer and did not provide its derivation, whereas this reconstruction does).

    Unset[{s, a, b, v0, v1, v2, v3, v4, v5, f1, f2, f3, solution}];
    v0 = Cos[Pi/4 - a] - Sin[Pi/4 - a];
    v1 = Tan[a];
    p1 = {(s - 1)/2, s/2} + RotationTransform[Pi/4 + a][{1/2 + v0, 2}];
    p2 = {1, 7} + RotationTransform[Pi/4 - a][{2, v2 + v1 - 1}];
    pdiff = p1 - p2;
    b = -ArcTan[pdiff[[1]], pdiff[[2]]] - Pi/4;
    v3 = RotationTransform[-Pi/4 + b][{2, 6} - ({(s - 1)/2, s/2} + RotationTransform[Pi/4 + a][{-1/2 + v0, 2 + v1}])][[2]];
    v4 = RotationTransform[-Pi/4 + b][{2, 6} - p1][[2]];
    v5 = RotationTransform[-Pi/4 + b][{2, 6} - ({(s - 1)/2, s/2} + RotationTransform[Pi/4 + a][{3/2 + v0, 2 - v1}])][[2]];
    f1 = RotationTransform[-Pi/4 + a][{s - 7, s - 2} - {1, 7}][[1]] - 3;
    f2 = EuclideanDistance[p1, p2] - 1;
    f3 = RotationTransform[-Pi/4 + a][{1, s - 2} - ({1, 7} + RotationTransform[Pi/4 - a][{0, v2 + v1}])][[2]] - 1;
    solution = FindRoot[{f1==0, f2==0, f3==0}, {{s, 10.6}, {a, .02}, {v2, 0}}, WorkingPrecision -> 200];
    N[{s, a*180/Pi, b*180/Pi, v0, v1, v2, v3, v4, v5} /. solution, 100]

    algdep(s      /. solution, 32, 1000)  (* verified to 75000 digits *)
    algdep(Tan[a] /. solution,  8,  100)  (* verified to 75000 digits *)
    algdep(Tan[b] /. solution,  8,  100)  (* verified to 75000 digits *)
    algdep(v2     /. solution,  8,  100)  (* verified to 75000 digits *)
(*
    s  = Root[115286657776 - 90796980368*# + 31085874777*#^2 - 6035595646*#^3 + 725823177*#^4 - 55256564*#^5 + 2594076*#^6 - 68416*#^7 + 772*#^8, 1]
    a  = ArcTan[Root[41 - 2000*# + 1400*#^2 - 4848*#^3 + 2710*#^4 - 4656*#^5 + 1800*#^6 - 1808*#^7 + 193*#^8, 1]]
    b  = ArcTan[Root[9553 - 6477624*# + 25617688*#^2 - 59272440*#^3 + 85456630*#^4 - 105630792*#^5 + 92188136*#^6 - 52835976*#^7 + 32405177*#^8, 1]]
    v2 = Root[1216 - 1296*# - 59564*#^2 + 3064*#^3 + 526997*#^4 - 1025888*#^5 + 800656*#^6 - 294784*#^7 + 49408*#^8, 1]
*)
-->
