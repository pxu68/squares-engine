    u6 = (({15, 1} + RotationTransform[a][{2 -  9*u2, 14 - r1}])[[2]] - (s -  6))/Sin[a];
    u7 = (({15, 1} + RotationTransform[a][{2 - 12*u2, 18 - r1}])[[2]] - (s -  3))/Sin[a];
    r8 = ({s - 16, s - 1} + RotationTransform[c][{-2, 0}])[[1]]/Sin[c];
    v9 = ((s - 16) - (Cos[a] + 2*Sin[a]))/Cos[a];
    f1 = RotationTransform[-a][{s - 14, s - 3} - {2, 14}][[1]] - 2;
    f2 = RotationTransform[-c][({s - 16, s - 1} + RotationTransform[c][{0, r8 - 1}]) - ({15, 1} + RotationTransform[a][{-14*u2, 20 - r1 - v9}])][[2]];
    f3 = D[f2, c];
    AbsoluteTiming[solution = Solve[{f1 == 0, f2 == 0, f3 == 0}, {s, a, c}][[7]]][[1]]      (*  4.312 seconds *)
  (*AbsoluteTiming[ToString[{s, a[[1, 1]], c[[1, 1]]} /. RootReduce[solution], InputForm]]*)
