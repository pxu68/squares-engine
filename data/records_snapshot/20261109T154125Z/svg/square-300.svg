    (* Alternative 3rd constraint *)
    f3 = Det[Grad[{s, f1, f2}, {s, a, c}]];

    AbsoluteTiming[ToString[RootApproximant[N[Tan[a[[1, 1]]] /. solution, 3000], 40], InputForm]]  (* took 32.994 seconds; verified correct with 100000 digits *)
