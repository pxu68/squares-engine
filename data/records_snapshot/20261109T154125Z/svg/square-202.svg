<?xml version="1.0" encoding="UTF-8"?>
<!--
    Found by Sigvart Brendberg's program, https://hohmiyazawa.github.io/squares_in_rects/squaredrawer.html
        But I overlooked it on November 17, 2024, because I was assuming optimal Göbel strips always had rigidity in the perpendicular direction, unlike this program.
    Made by extending the s(18) technique found by Frits Göbel in early 1979.
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "14.727922061357855439215198517887"> <!-- 2 + Sqrt[2]*18/2 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.0012" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="side1">
        <path style="stroke:none" d="M13,0 V1 H12 V2 H11 V3 H10 V4 H9 V5 H8 V6 H7 V7 H6 V8 H5 V9 H4 V10 H3 V11 H2 V12 H1 V13 H0 V0"/>
        <path style=  "fill:none" d="M13,0 V 1 H0
                                     M12,0 V 2 H0
                                     M11,0 V 3 H0
                                     M10,0 V 4 H0
                                     M 9,0 V 5 H0
                                     M 8,0 V 6 H0
                                     M 7,0 V 7 H0
                                     M 6,0 V 8 H0
                                     M 5,0 V 9 H0
                                     M 4,0 V10 H0
                                     M 3,0 V11 H0
                                     M 2,0 V12 H0
                                     M 1,0 V13 H0"/>
        <g transform="translate(&s;) scale(-1 1)">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M1,0 V1 H0"/>
        </g>
    </g>
    <use xlink:href="#side1" transform="translate(&s; &s;) scale(-1 -1)"/>
    <g transform="scale(.5) translate(&s; &s;) scale(2) rotate(45) translate(-.5 -9)">
        <rect width="1" height="18"/>
        <path style="fill:none" d="M0, 1 H1
                                   M0, 2 H1
                                   M0, 3 H1
                                   M0, 4 H1
                                   M0, 5 H1
                                   M0, 6 H1
                                   M0, 7 H1
                                   M0, 8 H1
                                   M0, 9 H1
                                   M0,10 H1
                                   M0,11 H1
                                   M0,12 H1
                                   M0,13 H1
                                   M0,14 H1
                                   M0,15 H1
                                   M0,16 H1
                                   M0,17 H1"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>