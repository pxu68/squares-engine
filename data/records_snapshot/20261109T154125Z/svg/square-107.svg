<!--
    Found by Károly Hajba in November 2024 (to 5 decimal places of precision: s ≤ 10.84697).
        Source: Private communication between David Ellsworth and Károly Hajba, November 11, 2024
    Is a mirror-symmetric alternative packing for an extension of the s(54) found by Joe DeVincentis in April 2014.
    Exact polynomial root solution by David Ellsworth on November 13, 2024.

    Solve[{RotationTransform[a][{s-5,s-5}-{5,4}][[2]] == 2,
           ({s-5,s-5}+RotationTransform[-a][{2-u2,-v1*2-2}])[[1]] == 6},
          {s, a}][[2]]
    s = Root[38633 - 15744*# + 2388*#^2 - 160*#^3 + 4*#^4, 2]
    a = ArcTan[Root[-7 + 12*# - 6*#^2 + 4*#^3 + #^4, 2]]
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "10.84666719284348978294331459095829791">
    <!ENTITY a  "34.73490026035109582567460505972131417">
    <!ENTITY v1 ".2520169206243201830964866042823804697"> <!-- Cos[a]-Sin[a]                  --> <!-- RotationTransform[a][{s - 5, s - 5} - {s - 4, s - 6}][[2]] -->
    <!ENTITY u2 ".0772849237805328581796161048748924519"> <!-- 6+(2+4*v1)*Cot[a]-(s-5)*Csc[a] --> <!-- -({s - 5, s - 5} + RotationTransform[-a][{6, -v1*4 - 2}])[[2]]/Sin[a] -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.003" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"/>
        <g id="two">
            <rect width="2" height="1" id="one"/>
            <path style="fill:none" d="M1,0 V1"/>
        </g>
        <g id="corner">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M1,0 V1 H0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <path style="stroke:none" d="M0,0 H8 V1 H7 V2 H6 V3 H5 V4 H4 V5 H3 V6 H2 V7 H1 V8 H0"/>
    <path style=  "fill:none" d="M0,1 H8 V0
                                 M0,2 H7 V0
                                 M0,3 H6 V0
                                 M0,4 H5 V0
                                 M0,5 H4 V0
                                 M0,6 H3 V0
                                 M0,7 H2 V0
                                 M0,8 H1 V0"/>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M0,0 H9 V1 H8 V2 H7 V3 H6 V4 H5 V5 H4 V6 H3 V7 H2 V8 H1 V9 H0"/>
        <path style=  "fill:none" d="M9,0 V1 H0
                                     M8,0 V2 H0
                                     M7,0 V3 H0
                                     M6,0 V4 H0
                                     M5,0 V5 H0
                                     M4,0 V6 H0
                                     M3,0 V7 H0
                                     M2,0 V8 H0
                                     M1,0 V9 H0"/>
    </g>
    <use xlink:href="#corner" transform="translate(&s; 0) scale(-1  1)"/>
    <use xlink:href="#corner" transform="translate(0 &s;) scale( 1 -1)"/>
    <g id="side1" transform="translate(&s; &s;) translate(-5 -5) rotate(-&a;) translate(0 -1)">
        <g id="lower">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 -&v1;)"/>
            <use xlink:href="#two" transform="translate(2 -&v1;) translate(0 -&v1;)"/>
            <use xlink:href="#one" transform="translate(4 -&v1;) translate(0 -&v1;) translate(0 -&v1;)"/>
            <use xlink:href="#one" transform="translate(5 -&v1;) translate(0 -&v1;) translate(0 -&v1;) translate(0 -&v1;)"/>
        </g>
        <use xlink:href="#lower" transform="translate(-&u2; -1)"/>
    </g>
    <use xlink:href="#side1" transform="rotate(90) scale(1 -1)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>