    <g transform="scale(.5) translate(&s; &s;) translate(-.5 -.5) scale(2) rotate(45) translate(-3 -5.5)">
        <rect width="6" height="11"/>
        <path style="fill:none" d="M0, 1 H6 M1,0 V11
