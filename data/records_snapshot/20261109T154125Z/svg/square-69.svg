<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.003" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"/>
        <g id="two">
            <rect width="1" height="2"/>
            <path style="fill:none" d="M0,1 H1"/>
        </g>
        <g id="two2">
            <path style="stroke:none" d="M&u2;,0 h1 V1 H1 V2 H0 V1 H&u2;"/>
            <path style=  "fill:none" d="M&u2;,0 h1 V1 H1 V2 H0 V1 H&u2; V0
                                         M&u2;,1 H1"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g>
        <path style="stroke:none" d="M0,0 H6 V1 H5 V2 H4 V3 H3 V4 H2 V5 H1 V6 H0"/>
        <path style=  "fill:none" d="M0,1 H6 V0
                                     M0,2 H5 V0
                                     M0,3 H4 V0
                                     M0,4 H3 V0
                                     M0,5 H2 V0
                                     M0,6 H1 V0"/>
        <g transform="translate(&s; &s;) scale(-1 -1)">
            <path style="stroke:none" d="M0,0 H7 V1 H6 V2 H5 V3 H4 V4 H3 V5 H2 V6 H1 V7 H0"/>
            <path style=  "fill:none" d="M0,1 H7 V0
                                         M0,2 H6 V0
                                         M0,3 H5 V0
                                         M0,4 H4 V0
                                         M0,5 H3 V0
                                         M0,6 H2 V0
                                         M0,7 H1 V0"/>
        </g>
        <g transform="translate(&s;) scale(-1 1)">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M1,0 V1 H0"/>
        </g>
        <g transform="translate(0 &s;) scale(1 -1)">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M0,1 H1 V0"/>
        </g>
        <g transform="translate(1 6) rotate(-&a;) translate(-&r0;)">
            <use xlink:href="#two"/>
            <use xlink:href="#two2" transform="translate(1     -&v1;)"/>
            <g transform="translate(2&u2; -&v3;)">
                <use xlink:href="#two"/>
                <g transform="translate(1 -&v3;)">
                    <use xlink:href="#two"/>
                    <g transform="translate(1 -&v3;)">
                        <use xlink:href="#two"/>
                        <use xlink:href="#two2" transform="translate(1 -&v4;)"/>
                    </g>
                </g>
            </g>
        </g>
        <!-- This was at first constructed with 3 different angles, where the "a" used in the following section was
             different than that used in the preceding section. But using FindMinimum[] on this construction led to
             the two different angles converging to exactly the same value, thus they have been merged into one. -->
        <g transform="translate(5 2) rotate(-&a;) translate(-&r5;)">
            <use xlink:href="#two"/>
            <g transform="translate(1 -&v6;)">
                <use xlink:href="#two"/>
                <use xlink:href="#two" transform="translate(1) rotate(&a;) rotate(-&b;) translate(0 -&r7;)"/>
            </g>
