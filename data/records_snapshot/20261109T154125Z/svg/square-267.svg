<?xml version="1.0" encoding="UTF-8"?>
<!--
    Extends the s(107) found by Károly Hajba in November 2024.
    Exact polynomial root solution by David Ellsworth on November 13, 2024.

    Solve[{RotationTransform[a][{s1-5,s1-5}-{5,4}][[2]] == 2,
           ({s1-5,s1-5}+RotationTransform[-a][{2-u2,-v1*2-2}])[[1]] == 6},
          {s1, a}][[2]]
    s1 = Root[38633 - 15744*# + 2388*#^2 - 160*#^3 + 4*#^4, 2]
    a = ArcTan[Root[-7 + 12*# - 6*#^2 + 4*#^3 + #^4, 2]]
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "16.84666719284348978294331459095829791">
    <!ENTITY s1 "10.84666719284348978294331459095829791">
    <!ENTITY a  "34.73490026035109582567460505972131417">
    <!ENTITY v1 ".2520169206243201830964866042823804697"> <!-- Cos[a]-Sin[a]                  --> <!-- RotationTransform[a][{s1 - 5, s1 - 5} - {s1 - 4, s1 - 6}][[2]] -->
    <!ENTITY u2 ".0772849237805328581796161048748924519"> <!-- 6+(2+4*v1)*Cot[a]-(s1-5)*Csc[a] --> <!-- -({s1 - 5, s1 - 5} + RotationTransform[-a][{6, -v1*4 - 2}])[[2]]/Sin[a] -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.003" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"/>
        <g id="two">
            <rect width="2" height="1" id="one"/>
            <path style="fill:none" d="M1,0 V1"/>
        </g>
        <g id="corner">
            <rect style="stroke:none" width="1" height="1"/>
            <path style=  "fill:none" d="M1,0 V1 H0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <path style="stroke:none" d="M0, 0 H14 V1 H13 V2 H12 V3 H11 V4 H10 V5 H9 V6 H8 V7 H7 V8 H6 V9 H5 V10 H4 V11 H3 V12 H2 V13 H1 V14 H0"/>
    <path style=  "fill:none" d="M0, 1 H14 V0
                                 M0, 2 H13 V0
                                 M0, 3 H12 V0
                                 M0, 4 H11 V0
                                 M0, 5 H10 V0
                                 M0, 6 H 9 V0
                                 M0, 7 H 8 V0
                                 M0, 8 H 7 V0
                                 M0, 9 H 6 V0
                                 M0,10 H 5 V0
                                 M0,11 H 4 V0
                                 M0,12 H 3 V0
                                 M0,13 H 2 V0
                                 M0,14 H 1 V0"/>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M 0,0 H15 V1 H14 V2 H13 V3 H12 V4 H11 V5 H10 V6 H9 V7 H8 V8 H7 V9 H6 V10 H5 V11 H4 V12 H3 V13 H2 V14 H1 V15 H0"/>
        <path style=  "fill:none" d="M15,0 V 1 H0
                                     M14,0 V 2 H0
                                     M13,0 V 3 H0
                                     M12,0 V 4 H0
                                     M11,0 V 5 H0
                                     M10,0 V 6 H0
                                     M 9,0 V 7 H0
                                     M 8,0 V 8 H0
                                     M 7,0 V 9 H0
                                     M 6,0 V10 H0
                                     M 5,0 V11 H0
                                     M 4,0 V12 H0
                                     M 3,0 V13 H0
                                     M 2,0 V14 H0
                                     M 1,0 V15 H0"/>
    </g>
    <use xlink:href="#corner" transform="translate(&s; 0) scale(-1  1)"/>
    <use xlink:href="#corner" transform="translate(0 &s;) scale( 1 -1)"/>
    <g id="side1">
        <g transform="translate(&s; &s;) translate(-5 -11) rotate(-&a;) translate(0 -1)">
            <g id="lower">
                <use xlink:href="#one"/>
                <use xlink:href="#one" transform="translate(1 -&v1;)"/>
            </g>
            <use xlink:href="#lower" transform="translate(-&u2; -1)"/>
        </g>
        <g id="addon" transform="translate(&s; &s;) translate(-5 -11) rotate(-&a;) translate(0 -1)">
            <g id="lower2">
                <use xlink:href="#two" transform="translate(2 -&v1;) translate(0 -&v1;)"/>
                <use xlink:href="#one" transform="translate(4 -&v1;) translate(0 -&v1;) translate(0 -&v1;)"/>
                <use xlink:href="#one" transform="translate(5 -&v1;) translate(0 -&v1;) translate(0 -&v1;) translate(0 -&v1;)"/>
            </g>
            <use xlink:href="#lower2" transform="translate(-&u2; -1)"/>
        </g>
        <use xlink:href="#addon" transform="translate(&s; &s;) scale(-1 -1) translate(-7 8)"/>
    </g>
    <use xlink:href="#side1" transform="rotate(90) scale(1 -1)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>