<!--
    Found by Károly Hajba on November 18, 2024, by extending the s(102) he found in September 2024, which extended the s(37) found by Evert Stenlund in early 1980.
    Improved by David Ellsworth on November 25, 2024, by adapting the s(102) improvement found by David W. Cantrell in November 2024.
    Improved by David Ellsworth on November 27, 2024, by generalizing the full technique used in the s(37) found by David W. Cantrell in September 2002.
    Improved by David Ellsworth on December 19, 2024.

    RootReduce[Solve[{RotationTransform[-Pi/4][({2 + (s - 13)/2, s - 1 + (s - 13)/2} + RotationTransform[Pi/4][{-3 + u5, -2 - 2*v3 + v4}] + RotationTransform[Pi/4 + a][{1 - 2*v0, -3 - v1}]) - {0, 0}][[2]] == 1/2,
                      RotationTransform[Pi/4 + a][{s - 10, s - 2} - {1, 10}][[2]] == 3},
                     {s, a}][[4]]]
    s = Root[9246853882609 - 5196681822080*# + 1265419604436*#^2 - 173849337008*#^3 + 14674175968*#^4 - 774089568*#^5 + 24654168*#^6 - 425088*#^7 + 2916*#^8, 1]
    a = ArcTan[Root[217 - 46144*# + 15180*#^2 - 87808*#^3 + 30454*#^4 - 66240*#^5 + 13644*#^6 - 20736*#^7 + 729*#^8, 1]]

    s = Root[FactorList[s[[1, 1]], Extension -> Sqrt[2]][[2, 1]], 1]
    s = Root[4049739 + 1891234*Sqrt[2] - (1047336 + 434398*Sqrt[2])*# + (98658 + 33466*Sqrt[2])*#^2 - (3936 + 864*Sqrt[2])*#^3 + 54*#^4, 1]
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s  "13.618988986601605479726620100480817">
    <!ENTITY a  ".26984786883697555602386662574637492">
    <!ENTITY r0 ".43974785750091942501391324366730331"> <!-- (s - 13)*Cos[Pi/4 - a] -->
    <!ENTITY v0 ".00666054477832248047738789931788480"> <!-- Cos[Pi/4 - a] - Sin[Pi/4 - a] -->
    <!ENTITY v1 ".00470976861413572077152929513647539"> <!-- Tan[a] -->
    <!ENTITY u2 ".00329703662878894023073087085951671"> <!-- 3 - RotationTransform[-Pi/4][{s - 11, s - 1} - {1, 10}][[1]] -->
    <!ENTITY v3 "1.0046986256034598134865947650649971"> <!-- Sin[a] + Cos[a] -->
    <!ENTITY v4 ".00066759566226718695311011801271383"> <!-- RotationTransform[-Pi/4][({2, s - 1} + RotationTransform[Pi/4 - a][{r0 - 2 + v0, -2 - v0 - v1}]) - ({2 + (s - 13)/2, s - 1 + (s - 13)/2} + RotationTransform[Pi/4][{-3, -1 - v3}])][[2]] -->
    <!ENTITY u5 ".00346425432457934808494136311261993"> <!-- u2 - (u[[1]] - u[[2]]*Tan[a] /. u -> RotationTransform[-Pi/4][{ 3,  8} - ({2 + (s - 13)/2, s - 1 + (s - 13)/2} + RotationTransform[Pi/4][{-3 + u2, -2 - 2*v3 + v4}])]) -->
    <!-- u5 above follows this rule: inside the "RotationTransform[Pi/4]", subtract 1 from the already negative "vertical" translation, leaving it otherwise identical to that used by the domino being
         corrected (notably, keep the exact number of "-v3" translations intact); CW is the "u2" variant, and CCW is the non-"u2" variant; at the beginning of the inside of the "RotationTransform[-Pi/4]",
         put the coordinates of the corner the domino is touching on its upper-left side. -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
        <rect width="1"   height="1"   id="one"  />
        <g id="corner">
            <path style="stroke:none" d="M2,0 V1 H1 V2 H0 V0"/>
            <path style=  "fill:none" d="M2,0 V1 H0
                                         M1,0 V2 H0"/>
        </g>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g>
        <path style="stroke:none" d="M10,0 V 1 H9 V2 H8 V3 H7 V4 H6 V5 H5 V6 H4 V7 H3 V8 H2 V9 H1 V10 H0 V0"/>
        <path style=  "fill:none" d="M10,0 V 1 H0
                                     M 9,0 V 2 H0
                                     M 8,0 V 3 H0
                                     M 7,0 V 4 H0
                                     M 6,0 V 5 H0
                                     M 5,0 V 6 H0
                                     M 4,0 V 7 H0
                                     M 3,0 V 8 H0
                                     M 2,0 V 9 H0
                                     M 1,0 V10 H0"/>
    </g>
    <use xlink:href="#corner" transform="translate(&s;    ) scale(-1  1)"/>
    <use xlink:href="#corner" transform="translate(0   &s;) scale( 1 -1)"/>
    <g transform="translate(&s; &s;) scale(-1 -1)">
        <path style="stroke:none" d="M11,0 V1 H10 V2 H9 V3 H8 V4 H7 V5 H6 V6 H5 V7 H4 V8 H3 V9 H2 V10 H1 V11 H0 V0"/>
        <path style=  "fill:none" d="M11,0 V 1 H0
                                     M10,0 V 2 H0
                                     M 9,0 V 3 H0
                                     M 8,0 V 4 H0
                                     M 7,0 V 5 H0
                                     M 6,0 V 6 H0
                                     M 5,0 V 7 H0
                                     M 4,0 V 8 H0
                                     M 3,0 V 9 H0
                                     M 2,0 V10 H0
                                     M 1,0 V11 H0"/>
    </g>
    <defs>
        <g id="straight">
            <rect width="3" height="1"/>
            <path style="fill:none" d="M1,0 v1
                                       M2,0 v1
                                       M3,0 v1"/>
        </g>
        <g id="turn_CCW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 &v1;)"/>
            <use xlink:href="#one" transform="translate(1 &v1;) translate(1 &v1;)"/>
        </g>
        <g id="turn_CW">
            <use xlink:href="#one"/>
            <use xlink:href="#one" transform="translate(1 -&v1;)"/>
            <use xlink:href="#one" transform="translate(1 -&v1;) translate(1 -&v1;)"/>
        </g>
    </defs>
    <g id="side1">
        <g transform="translate(2 &s;) translate(0 -1) rotate(45) rotate(-&a;) translate(&r0;) translate(-3 -1) translate(0 -&v0;) translate(0 -&v1;)">
            <use xlink:href="#turn_CCW"/>
            <use xlink:href="#turn_CCW" transform="translate(&v0; -1)"/>
        </g>
        <g transform="scale(.5 1) translate(&s; &s;) translate(-9 -1) scale(2 .5) translate(0 &s;) translate(0 -13) scale(1 2) rotate(45) translate(-3 -1) translate(0 &v4;)">
            <use xlink:href="#straight" transform="translate(&u2;) translate(0 -1) translate(0 -&v3;)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -1)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -2)"/>
            <use xlink:href="#turn_CW"  transform="translate(&u5;) translate(0 -1) translate(0 -&v3;) translate(0 -&v3;) rotate(&a;) translate(-&v0; -3) translate(-&v0;)"/>
        </g>
    </g>
    <use xlink:href="#straight" transform="translate(&s; &s;) translate(-6 -6) rotate(45) translate(-3 -.5)"/>
    <use xlink:href="#side1" transform="rotate(90) scale(1 -1)"/>
    <use xlink:href="#outer" style="fill:none"/>
</svg>