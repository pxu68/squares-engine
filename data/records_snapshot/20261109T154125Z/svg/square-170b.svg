<?xml version="1.0" encoding="UTF-8"?>
<!--
    Found by Károly Hajba on November 18, 2024.
    Extends the s(65) found by Frits Göbel in 1979.
    Is a primitive packing alternative for the result of adding five "L"s to s(65).
-->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
    <!ENTITY s "13.535533905932737622004221810524"> <!-- 10 + Sqrt[2]*5/2 -->
]>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="0 0 &s; &s;" style="fill:#B2B2B2; stroke:black; stroke-width:0.002" id="svg">
    <script xlink:href="svgDisp.js"/>
    <defs>
        <rect width="&s;" height="&s;" id="outer"/>
    </defs>
    <use xlink:href="#outer" style="fill:white; stroke:none"/>
    <g id="side1">
        <path style="stroke:none" d="M9,0 V1 H8 V2 H7 V3 H6 V4 H5 V5 H4 V6 H3 V7 H2 V8 H1 V9 H0 V0"/>
        <path style=  "fill:none" d="M9,0 V1 H0
                                     M8,0 V2 H0
                                     M7,0 V3 H0
                                     M6,0 V4 H0
                                     M5,0 V5 H0
                                     M4,0 V6 H0
                                     M3,0 V7 H0
                                     M2,0 V8 H0
                                     M1,0 V9 H0"/>
    </g>
    <use xlink:href="#side1" transform="translate(&s; &s;) scale(-1 -1)"/>
    <defs>
        <g id="side2">
            <path style="stroke:none" d="M4,0 V1 H3 V2 H2 V3 H1 V4 H0 V0"/>
            <path style=  "fill:none" d="M4,0 V1 H0
                                         M3,0 V2 H0
                                         M2,0 V3 H0
                                         M1,0 V4 H0"/>
        </g>
    </defs>
    <use xlink:href="#side2" transform="translate(&s;    ) scale(-1  1)"/>
    <use xlink:href="#side2" transform="translate(0   &s;) scale( 1 -1)"/>
    <g transform="scale(.5) translate(&s; &s;) scale(2) rotate(45) translate(-2.5 -6)">
        <rect width="5" height="12"/>
        <path style="fill:none" d="M1,0 V12
                                   M2,0 V12
                                   M3,0 V12
                                   M4,0 V12
                                   M0, 1 H5
                                   M0, 2 H5
                                   M0, 3 H5
                                   M0, 4 H5
                                   M0, 5 H5
                                   M0, 6 H5
                                   M0, 7 H5
                                   M0, 8 H5
                                   M0, 9 H5
                                   M0,10 H5
                                   M0,11 H5"/>
    </g>
    <use xlink:href="#outer" style="fill:none"/>
</svg>